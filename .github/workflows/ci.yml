name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（pre-commit + pytest）
    # 必须用 Windows：tests/test_workbench.py 的登录配置测试会调用真实的
    # Windows DPAPI（course_progress/credentials.py 在非 Windows 上按设计抛错）。
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Runner 的 stdout 被重定向，Python 回退到 cp1252；含中文或框线符号的
      # 输出（import-linter / 结构自检）会抛 UnicodeEncodeError。
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --locked

      # tests/test_browser_observer.py 会真的启动一个 headless Chromium 来验证
      # 借用标签页的观测链路；缺少浏览器时 playwright 返回不存在的可执行文件
      # 路径，Popen 抛 FileNotFoundError。
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: 安装 Playwright Chromium
        # 用 `python -m` 而非 `uv run playwright`：后者的 uv trampoline 在本项目
        # 环境里无法解析脚本路径（`uv trampoline failed to canonicalize script
        # path`），而 playwright 自带 __main__，走 `-m` 更稳。
        run: uv run python -m playwright install chromium

      - name: 缓存 pre-commit 环境
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pre-commit
            ~/AppData/Local/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # 与本地提交钩子使用同一套配置，避免「本地过、CI 挂」。
      - name: 提交钩子（卫生 / ruff / mypy / import-linter / 结构自检）
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # pytest 不在提交钩子里（约 23 秒太慢），只在 CI 运行。
      - name: 测试
        run: uv run pytest tests/ -q

  frontend:
    name: 前端（Vitest）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 测试
        run: npm test
