openapi: 3.0.3
info: {title: Academic Selection Workbench, version: 0.1.0}
paths:
  /api/state:
    get:
      responses:
        '200':
          description: Local persisted workbench state
          content: {application/json: {schema: {$ref: '#/components/schemas/WorkbenchState'}}}
  /api/requirement-baseline-selection:
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RequirementBaselineSelectionRequest'}}}}
      responses: {'200': {description: Requirement baseline selected locally}, '409': {description: Explicit confirmation or version validation failed}}
  /api/recognized-credits:
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecognizedCreditRequest'}}}}
      responses: {'201': {description: Local declaration created}, '200': {description: Idempotent existing declaration returned}, '400': {description: Invalid declaration}}
  /api/recognized-credits/{identity}:
    parameters: [{name: identity, in: path, required: true, schema: {type: string}}]
    put:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecognizedCreditRequest'}}}}
      responses: {'200': {description: Local declaration updated}, '400': {description: Invalid or missing declaration}}
    delete:
      responses: {'204': {description: Local declaration deleted}, '404': {description: Declaration not found}}
  /api/course-labels/{identity}:
    parameters: [{name: identity, in: path, required: true, schema: {type: string}}]
    put:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CourseLabelRequest'}}}}
      responses:
        '200': {description: Local course label saved, content: {application/json: {schema: {$ref: '#/components/schemas/CourseLabel'}}}}
        '400': {description: Invalid or unknown course identity}
    delete:
      responses: {'204': {description: Local course label deleted}, '404': {description: Label not found}}
  /api/outside-major-track:
    put:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OutsideMajorTrackRequest'}}}}
      responses:
        '200': {description: Local outside-major track selected, content: {application/json: {schema: {$ref: '#/components/schemas/OutsideMajorTrack'}}}}
        '400': {description: Invalid track}
    delete:
      responses: {'204': {description: Local outside-major track cleared}}
  /api/login-configuration:
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginConfigurationRequest'}}}}
      responses: {'201': {description: DPAPI-protected login saved}, '400': {description: Invalid login configuration}}
    delete:
      responses: {'204': {description: Saved login cleared}}
  /api/tasks:
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskRequest'}}}}
      responses: {'202': {description: Accepted}}
  /api/plans:
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlanRequest'}}}}
      responses: {'201': {description: Persisted read-only plan}}
  /api/plans/latest:
    get:
      responses: {'200': {description: Latest persisted read-only plan}, '404': {description: No plan}}
  /api/progress-projection:
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlanRequest'}}}}
      responses:
        '200':
          description: Unified local projection without academic-system access
          content: {application/json: {schema: {$ref: '#/components/schemas/GraduationProgress'}}}
        '400': {description: Invalid goals}
        '413': {description: Projection request too large}
  /api/executions:
    get:
      responses: {'200': {description: Local redacted execution history}}
    delete:
      responses: {'204': {description: Execution history cleared}}
  /api/executions/{identity}/resolve:
    post:
      parameters: [{name: identity, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Unknown execution resolved}, '404': {description: Unknown execution not found}}
  /api/executions/selection:
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SelectionExecutionRequest'}}}}
      responses: {'202': {description: Explicitly confirmed single execution queued}, '409': {description: Confirmation or applicability check failed}}
  /api/tasks/{identity}:
    get:
      parameters: [{name: identity, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Task state}, '404': {description: Task not found}}
    delete:
      parameters: [{name: identity, in: path, required: true, schema: {type: string}}]
      responses: {'202': {description: Cancellation requested}, '409': {description: Task cannot be cancelled}}
  /api/tasks/{identity}/finish:
    post:
      parameters: [{name: identity, in: path, required: true, schema: {type: string}}]
      responses: {'202': {description: Observation finish requested}, '409': {description: Task cannot be finished}}
  /api/notices/candidates:
    get:
      responses: {'200': {description: Candidate notice versions}}
  /api/notices/discover:
    post:
      requestBody: {required: false, content: {application/json: {schema: {type: object, properties: {index_url: {type: string, format: uri}}}}}}
      responses: {'201': {description: Matching official notice pages downloaded, parsed, and saved}, '400': {description: Official notice source could not be read}}
  /api/notices/{identity}/confirm:
    post:
      parameters: [{name: identity, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Notice confirmed}, '409': {description: Notice cannot be confirmed}}
  /api/timetable/import:
    post:
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, properties: {timetable: {type: string, format: binary}, term: {type: string}}}}}}
      responses: {'201': {description: Timetable snapshot imported}}
components:
  schemas:
    RequirementBaselineSelectionRequest:
      type: object
      required: [version, confirmation]
      properties:
        version: {type: string}
        confirmation: {type: string, description: Must exactly equal version}
    CourseLabelRequest:
      type: object
      required: [d_category, four_histories, outside_track]
      properties:
        d_category: {type: boolean}
        four_histories: {type: boolean}
        outside_track: {type: string, maxLength: 80}
    CourseLabel:
      allOf:
        - {$ref: '#/components/schemas/CourseLabelRequest'}
        - type: object
          required: [course_identity, baseline_version, updated_at]
          properties:
            course_identity: {type: string}
            baseline_version: {type: string}
            updated_at: {type: string, format: date-time}
    OutsideMajorTrackRequest:
      type: object
      required: [track]
      properties:
        track: {type: string, minLength: 1, maxLength: 80}
    OutsideMajorTrack:
      allOf:
        - {$ref: '#/components/schemas/OutsideMajorTrackRequest'}
        - type: object
          required: [baseline_version, selected_at]
          properties:
            baseline_version: {type: string}
            selected_at: {type: string, format: date-time}
    RecognizedCreditRequest:
      type: object
      required: [identity, category, credits, note, recognized_on]
      properties:
        identity: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$'}
        category: {type: string, enum: [innovation, social_practice, cultural_quality]}
        credits: {type: number, exclusiveMinimum: true, minimum: 0, maximum: 100}
        note: {type: string, minLength: 1, maxLength: 300}
        recognized_on: {type: string, format: date}
        linked_course_identity: {type: string, maxLength: 128}
    RecognizedCredit:
      allOf:
        - {$ref: '#/components/schemas/RecognizedCreditRequest'}
        - type: object
          required: [baseline_version, linked_course_identity, created_at, updated_at]
          properties:
            baseline_version: {type: string}
            linked_course_identity: {type: string}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    RequirementBaselineRequirement:
      type: object
      required: [key, label, minimum, unit, evidence]
      properties:
        key: {type: string}
        label: {type: string}
        minimum: {type: number}
        unit: {type: string, enum: [credits, courses]}
        source: {type: string}
        parent: {type: string}
        constraint: {type: string, enum: ["", single_track]}
        evidence: {type: string, enum: [grade_records, grade_and_recognition, classification]}
        contribution_keys: {type: array, items: {type: string}}
        required_conditions: {type: array, items: {type: string}}
    RequirementBaseline:
      type: object
      required: [version, title, authority, requires_explicit_selection, source_summary, applicability, coverage, disclaimer, requirements, category_mapping]
      properties:
        version: {type: string}
        title: {type: string}
        authority: {type: string}
        requires_explicit_selection: {type: boolean}
        source_summary: {type: string}
        applicability: {type: string}
        coverage: {type: string}
        disclaimer: {type: string}
        selected_at: {type: string}
        manual_supplements: {type: array, items: {type: string}}
        requirements: {type: array, items: {$ref: '#/components/schemas/RequirementBaselineRequirement'}}
        category_mapping:
          type: object
          additionalProperties:
            oneOf:
              - {type: string}
              - {type: array, items: {type: string}}
    LoginConfigurationRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, maxLength: 64}
        password: {type: string, format: password, maxLength: 256}
    TaskRequest:
      type: object
      required: [operation]
      properties:
        operation: {type: string, enum: [connect, refresh-selection, refresh-timetable, refresh-progress, observe-navigation]}
        context: {type: object, additionalProperties: true}
    PlanRequest:
      type: object
      required: [goals]
      properties:
        goals: {type: array, items: {type: object, additionalProperties: true}}
    SelectionExecutionRequest:
      type: object
      required: [section_id, snapshot_id, confirmation]
      properties:
        section_id: {type: string}
        snapshot_id: {type: string}
        confirmation: {type: string, description: Must exactly equal section_id}
    LoginConfiguration:
      type: object
      required: [state, configured]
      properties:
        state: {type: string, enum: [missing, configured, invalid]}
        configured: {type: boolean}
        masked_username: {type: string}
        message: {type: string}
    Task:
      type: object
      required: [id, state]
      properties:
        id: {type: string}
        operation: {type: string}
        task_kind: {type: string, enum: [observation, execution]}
        state: {type: string}
        progress: {type: object, additionalProperties: true}
        error: {type: string}
    CandidateNotice:
      type: object
      required: [version_id, status]
      properties:
        version_id: {type: string}
        status: {type: string}
        title: {type: string}
        term: {type: string}
        query_eligible: {type: boolean}
      additionalProperties: true
    Snapshot:
      type: object
      required: [id, kind, term, source, source_at, payload]
      properties:
        id: {type: string}
        kind: {type: string}
        term: {type: string}
        profile_id: {type: string, nullable: true}
        notice_id: {type: string, nullable: true}
        source: {type: string}
        source_at: {type: string}
        created_at: {type: string}
        payload: {type: object, additionalProperties: true}
    CompletedCourseFact:
      type: object
      required: [code, name, category, credits]
      properties:
        code: {type: string}
        name: {type: string}
        category: {type: string}
        credits: {type: number}
    RequirementProgress:
      type: object
      required: [key, label, unit, source, parent, constraint, rule_detail, minimum, confirmed_amount, confirmed_gap, condition_status, condition_detail, reason, reason_detail, required_credits, completed_credits, remaining_credits, courses]
      properties:
        key: {type: string}
        label: {type: string}
        unit: {type: string, enum: [credits, courses]}
        source: {type: string}
        parent: {type: string}
        constraint: {type: string, enum: ["", single_track]}
        rule_detail: {type: string}
        minimum: {type: number}
        confirmed_amount: {type: number}
        confirmed_gap: {type: number}
        condition_status: {type: string, enum: [satisfied, not_satisfied, unknown]}
        condition_detail: {type: string}
        reason:
          type: string
          enum: [confirmed_minimum_met, confirmed_below_minimum, grade_data_incomplete, recognized_credit_coverage_missing, classification_evidence_missing, outside_major_track_unconfirmed, required_subconstraint_unknown, required_subconstraint_not_satisfied]
        reason_detail: {type: string}
        declared_amount: {type: number}
        labeled_amount: {type: number}
        enrolled_amount: {type: number}
        queued_amount: {type: number}
        estimated_amount: {type: number}
        estimated_gap: {type: number}
        estimated_condition_detail: {type: string}
        declarations: {type: array, items: {type: object, additionalProperties: true}}
        enrolled_courses: {type: array, items: {type: object, additionalProperties: true}}
        queued_courses: {type: array, items: {type: object, additionalProperties: true}}
        pending_verification: {type: array, items: {type: object, additionalProperties: true}}
        manual_review_required: {type: boolean}
        labeled_courses: {type: array, items: {type: object, additionalProperties: true}}
        estimate_replaces_confirmed: {type: boolean}
        estimated_condition_status: {type: string, enum: [estimated_satisfied, unknown]}
        selected_track: {type: string}
        other_track_course_identities: {type: array, items: {type: string}}
        unknown_track_course_identities: {type: array, items: {type: string}}
        required_credits: {type: number}
        completed_credits: {type: number}
        remaining_credits: {type: number}
        courses: {type: array, items: {$ref: '#/components/schemas/CompletedCourseFact'}}
    GraduationProgressReport:
      type: object
      required: [data_complete, progress]
      properties:
        generated_at: {type: string}
        baseline_version: {type: string}
        data_complete: {type: boolean}
        coverage: {type: object, additionalProperties: {type: string}}
        progress: {type: array, items: {$ref: '#/components/schemas/RequirementProgress'}}
    GraduationProgress:
      type: object
      required: [status, report]
      properties:
        status: {type: string, enum: [ready, incomplete, missing, invalid, not_applicable, historical]}
        report: {$ref: '#/components/schemas/GraduationProgressReport', nullable: true}
        historical_report: {$ref: '#/components/schemas/GraduationProgressReport', nullable: true}
        reason: {type: string}
        snapshot: {$ref: '#/components/schemas/Snapshot', nullable: true}
    WorkbenchState:
      type: object
      required: [login_configuration, requirement_baselines, selected_requirement_baseline, recognized_credits, course_labels, labelable_courses, outside_major_track, profile, confirmed_notice, snapshots, snapshot_changes, latest_plan, graduation_progress, stale, snapshot_status, academic_session, active_task, execution_history, csrf_token]
      properties:
        login_configuration: {$ref: '#/components/schemas/LoginConfiguration'}
        requirement_baselines: {type: array, items: {$ref: '#/components/schemas/RequirementBaseline'}}
        selected_requirement_baseline:
          nullable: true
          allOf:
            - {$ref: '#/components/schemas/RequirementBaseline'}
        recognized_credits: {type: array, items: {$ref: '#/components/schemas/RecognizedCredit'}}
        course_labels: {type: array, items: {$ref: '#/components/schemas/CourseLabel'}}
        labelable_courses: {type: array, items: {$ref: '#/components/schemas/CompletedCourseFact'}}
        outside_major_track:
          nullable: true
          allOf:
            - {$ref: '#/components/schemas/OutsideMajorTrack'}
        profile: {type: object, nullable: true, additionalProperties: true}
        confirmed_notice: {type: object, nullable: true, additionalProperties: true}
        snapshots:
          type: object
          required: [selection, timetable, progress]
          properties:
            selection: {$ref: '#/components/schemas/Snapshot', nullable: true}
            timetable: {$ref: '#/components/schemas/Snapshot', nullable: true}
            progress: {$ref: '#/components/schemas/Snapshot', nullable: true}
        snapshot_changes:
          type: object
          required: [selection, timetable, progress]
          properties:
            selection: {type: object, nullable: true, additionalProperties: true}
            timetable: {type: object, nullable: true, additionalProperties: true}
            progress: {type: object, nullable: true, additionalProperties: true}
        latest_plan: {type: object, nullable: true, additionalProperties: true}
        graduation_progress: {$ref: '#/components/schemas/GraduationProgress'}
        stale:
          type: object
          required: [selection, timetable, progress]
          properties:
            selection: {type: boolean}
            timetable: {type: boolean}
            progress: {type: boolean}
        snapshot_status:
          type: object
          additionalProperties:
            type: object
            required: [status, reason, source_at]
            properties:
              status: {type: string, enum: [current, historical, incomplete, missing]}
              reason: {type: string}
              source_at: {type: string}
        academic_session:
          type: object
          required: [state, browser, webvpn, last_verified_at]
          properties:
            state: {type: string}
            browser: {type: string}
            webvpn: {type: string}
            last_verified_at: {type: string}
        active_task: {$ref: '#/components/schemas/Task', nullable: true}
        execution_history: {type: array, items: {type: object, additionalProperties: true}}
        csrf_token: {type: string}
