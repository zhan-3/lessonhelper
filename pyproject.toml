[project]
name = "lesson-helper"
version = "0.1.0"
description = "HITWH 校园教务辅助工具集：本地优先的选课规划、毕业进度推算与实验预约（实验性）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.0",
    "openpyxl>=3.1.0",
    "playwright>=1.58.0",
    "python-dotenv>=1.0",
    "waitress>=3.0.0",
    "xlrd>=2.0.1",
]

[project.scripts]
course-selection = "course_selection.cli:main"

[project.gui-scripts]
course-selection-gui = "course_selection.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
    "watchfiles>=1.0",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
files = ["course_selection", "course_progress"]
ignore_missing_imports = true
show_error_codes = true
warn_unused_ignores = true

# 渐进式类型化：下列 15 个模块仍有已知类型错误（多数源于用
# dict[str, object] 承载结构化数据，需要重构成 TypedDict 才能根治），
# 先排除以便其余 37 个模块和新增代码受类型保护。
#
# 修复一个模块就从这里删掉一行。
# 基线：114 个错误 / 15 个模块，2026-09-19 测量。
[[tool.mypy.overrides]]
module = [
    "course_progress.progress",
    "course_progress.session",
    "course_selection.browser_observer",
    "course_selection.cli",
    "course_selection.deep_observation",
    "course_selection.gateway",
    "course_selection.lab_contract",
    "course_selection.manual_observation",
    "course_selection.notice",
    "course_selection.personal_timetable",
    "course_selection.planning",
    "course_selection.request_contracts",
    "course_selection.selection_entry",
    "course_selection.tasks",
    "course_selection.timetable",
]
ignore_errors = true

[tool.ruff.lint]
# BLE001: 有意的防御性降级。Playwright 异常类型随运行时版本变化，
# 元素查找/会话存活检测/重试失败均以“任何异常”作为降级信号，
# 各捕获点均已注释或由上下文明确意图。
ignore = ["BLE001"]

[tool.setuptools.packages.find]
include = ["course_selection*", "course_progress*"]


[tool.importlinter]
root_packages = ["course_selection", "course_progress"]
include_external_packages = true

# 应用核心不得依赖具体传输实现、HTTP 适配器或浏览器观察层。
# 核心模块表见 docs/architecture.md §3.1；此契约取代了早期手写的 AST 脚本。
[[tool.importlinter.contracts]]
name = "应用核心不得依赖外部适配器与 HTTP 层"
type = "forbidden"
source_modules = [
    "course_selection.workbench_service",
    "course_selection.planning",
    "course_selection.lab_booking",
    "course_selection.lab_contract",
    "course_selection.categories",
    "course_selection.persistence",
    "course_selection.config",
    "course_selection.timetable",
    "course_selection.lab_ports",
    "course_selection.notice",
    "course_selection.notice_discovery",
]
forbidden_modules = [
    # 外部适配器
    "course_selection.gateway",
    "course_selection.lab_transport",
    "course_selection.lab_browser_session",
    "course_selection.notice_transport",
    "course_selection.discovery",
    "course_selection.tasks",
    "course_selection.selection_entry",
    "course_selection.selection_query",
    "course_selection.selection_execution",
    "course_selection.current_enrollment",
    "course_selection.personal_timetable",
    "course_selection.deep_observation",
    "course_selection.manual_observation",
    "course_selection.student_profile",
    "course_selection.student_profile_observation",
    "course_selection.shadow_acceptance",
    # 浏览器观察
    "course_selection.browser_observer",
    "course_selection.browser_observer_worker",
    "course_selection.browser_redaction",
    "course_selection.request_contracts",
    "course_selection.observer_evals",
    # HTTP 适配器
    "course_selection.workbench",
    "course_selection.web",
    "course_selection.application",
    "course_selection.dev_workbench",
    # 框架
    "flask",
]

# 包内依赖不成环
[[tool.importlinter.contracts]]
name = "内部依赖不成环"
type = "acyclic_siblings"
ancestors = ["course_selection", "course_progress"]
