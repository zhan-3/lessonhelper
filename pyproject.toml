[project]
name = "lab-scraper"
version = "0.1.0"
description = "HITWH 开放式实验系统抢课自动化工具 | CAS SSO 登录 + Playwright 人工辅助登录 + 会话持久化 + 自动预约 + 监控模式"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.0",
    "openpyxl>=3.1.0",
    "playwright>=1.58.0",
    "python-dotenv>=1.0",
    "waitress>=3.0.0",
    "xlrd>=2.0.1",
]

[project.scripts]
course-selection = "course_selection.cli:main"
lab-book = "course_selection.cli:lab_book_main"

[project.gui-scripts]
course-selection-gui = "course_selection.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "watchfiles>=1.0"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["course_selection*", "course_progress*"]
