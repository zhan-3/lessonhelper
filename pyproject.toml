[project]
name = "lesson-helper"
version = "0.1.0"
description = "HITWH 校园教务辅助工具集：本地优先的选课规划、毕业进度推算与实验预约（实验性）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.0",
    "openpyxl>=3.1.0",
    "playwright>=1.58.0",
    "python-dotenv>=1.0",
    "waitress>=3.0.0",
    "xlrd>=2.0.1",
]

[project.scripts]
course-selection = "course_selection.cli:main"

[project.gui-scripts]
course-selection-gui = "course_selection.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "watchfiles>=1.0"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# BLE001: 有意的防御性降级。Playwright 异常类型随运行时版本变化，
# 元素查找/会话存活检测/重试失败均以“任何异常”作为降级信号，
# 各捕获点均已注释或由上下文明确意图。
ignore = ["BLE001"]

[tool.setuptools.packages.find]
include = ["course_selection*", "course_progress*"]
